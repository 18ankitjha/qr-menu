# CI — every push to main and every PR builds the API + all four front-ends.
# On a push to main, once every build passes, the deploy job calls Render's Deploy Hook.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [server, client/admin, client/menu, client/kitchen, client/super-admin]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json

      - name: Install
        run: npm ci

      # server: tsc · apps: tsc -b && vite build
      - name: Type-check and build
        run: npm run build

  # CD — once every build above passes on a push to main, ask Render to deploy via its Deploy Hook.
  # Set the repo secret RENDER_DEPLOY_HOOK_URL (Render → service → Settings → Deploy Hook). Skipped if unset.
  deploy:
    name: deploy (Render)
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
    steps:
      - name: Trigger Render deploy
        if: env.RENDER_DEPLOY_HOOK_URL != ''
        run: curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL" > /dev/null && echo "Render deploy triggered for $GITHUB_SHA"

      - name: Hook not configured
        if: env.RENDER_DEPLOY_HOOK_URL == ''
        run: echo "::warning::RENDER_DEPLOY_HOOK_URL secret is not set, so Render was not asked to deploy."
